[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sstm-flow"
version = "0.1.2"
description = "PyTorch package for SSTM optical flow inference"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-2-Clause" }
authors = [
  { name = "Fisseha A. Ferede" }
]
dependencies = [
  "numpy>=1.21",
  "opencv-python>=4.6",
  "einops>=0.5",
  "scipy>=1.7"
]

[project.urls]
Homepage = "https://github.com/Computational-Ocularscience/SSTM"
Repository = "https://github.com/Computational-Ocularscience/SSTM"

[project.scripts]
sstm-flow = "sstm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]